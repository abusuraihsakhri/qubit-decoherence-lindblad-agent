name: Python and Browser Regression Checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
      - name: Compile and check installed dependencies
        run: |
          python -m compileall -q agents lindblad_decoherence cli.py enrichment.py
          python -m pip check
      - name: Python unit tests
        run: python -m pytest -q
      - name: Verify baseline audit chain
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser script syntax
        run: node --check web/app.js
      - name: Test browser physics against analytic references
        run: node tests/test_web.js
