[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qubit-decoherence-lindblad-engine"
version = "2.0.0"
description = "Lindblad Master Equation T1 / T2 Qubit Decoherence Simulator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
qubit-decoherence-lindblad-engine = "lindblad_decoherence.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/qubit-decoherence-lindblad-engine"
Repository = "https://github.com/abusuraihsakhri/qubit-decoherence-lindblad-engine.git"
